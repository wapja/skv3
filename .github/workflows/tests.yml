name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main (PHP 8.4, PostgreSQL)
            php: '8.4'
            db: pgsql
            impersonation: 'true'
            passkeys: 'true'
          - name: sqlite-free (PHP 8.4, SQLite)
            php: '8.4'
            db: sqlite
            # §6.8: the free job runs the whole suite with both optional modules off.
            impersonation: 'false'
            passkeys: 'false'
          - name: php85 (PHP 8.5, SQLite)
            php: '8.5'
            db: sqlite
            impersonation: 'true'
            passkeys: 'true'

    env:
      MODULE_IMPERSONATION: ${{ matrix.impersonation }}
      MODULE_PASSKEYS: ${{ matrix.passkeys }}
      # §6.7: an `if:` cannot read secrets, so the job maps only whether they exist (fork PRs get none). The credentials
      # themselves are mapped in the Flux Pro step alone, so no install script or test process sees the licence key.
      FLUX_PRO_SECRETS: ${{ secrets.FLUX_USERNAME != '' && secrets.FLUX_LICENSE_KEY != '' }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer and analysis caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            storage/framework/cache/phpstan
            storage/framework/cache/rector
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --ansi
          npm ci
          npm run build

      # §6.7, §8: only the main (PostgreSQL) row enables Pro, before any view compiles; without the secrets the step is
      # skipped and the job runs on free Flux. --global writes COMPOSER_HOME/auth.json, never a file in the checkout.
      # The step's own Composer cache keeps the Pro dist zip out of the cached files directory, which pull requests
      # (forks included) can restore; skv:flux-pro's composer inherits COMPOSER_CACHE_DIR.
      - name: Enable Flux Pro
        if: env.FLUX_PRO_SECRETS == 'true' && matrix.db == 'pgsql'
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-flux-pro
        run: |
          composer config --global http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"
          php artisan skv:flux-pro --no-interaction

      - name: Audit dependencies
        run: composer audit

      - name: Check (SQLite)
        if: matrix.db == 'sqlite'
        run: composer check

      - name: Check (PostgreSQL)
        if: matrix.db == 'pgsql'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: composer check

  browser:
    name: browser (PHP ${{ matrix.php }}, SQLite, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, sockets
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-browser-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-browser-

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Chromium resolves *.localhost to loopback itself, so the tenant hosts need no /etc/hosts step (Task 1 spike, RL-2).
      - name: Install
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --ansi
          npm ci
          npm run build

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser binaries only; the system libraries Chromium needs are installed each run.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser tests
        run: composer test:browser

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-artifacts
          path: |
            tests/Browser/Screenshots
            tests/Browser/Traces
          if-no-files-found: ignore
          # Traces hold request and response bodies and cookies of the test run; keep them only briefly.
          retention-days: 7
